<g><rect x="100" y="723" width="300" height="42" rx="7" class="bx emb"/><text x="250" y="740" text-anchor="middle" class="m">输入嵌入</text><text x="250" y="757" text-anchor="middle" class="s">Input Embedding</text></g>
