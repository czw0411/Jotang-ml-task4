<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" font-family="Segoe UI, Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" role="img" aria-label="Transformer architecture: encoder on the left, decoder in the middle, with scaled dot-product attention and multi-head attention expanded on the right">
<title>Transformer 结构图（重绘自 Attention Is All You Need, Figure 1）</title>
<style>
  svg { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --line:#8c959f; --panel:#f6f8fa;
        --panel-line:#d1d9e0;
        --emb-fill:#fde7f1; --emb-line:#bf3989;
        --attn-fill:#ffead5; --attn-line:#bc4c00;
        --norm-fill:#fdf5c8; --norm-line:#9a7c00;
        --ffn-fill:#ddf4ff; --ffn-line:#0969da;
        --io-fill:#eef1f4; --io-line:#5c6771; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#0d1117; --fg:#e6edf3; --muted:#9aa4ae; --line:#6e7681; --panel:#161b22;
          --panel-line:#30363d;
          --emb-fill:#3d1d2f; --emb-line:#f778ba;
          --attn-fill:#3d2607; --attn-line:#e8873a;
          --norm-fill:#332d08; --norm-line:#d4a72c;
          --ffn-fill:#0d2a4d; --ffn-line:#6cb6ff;
          --io-fill:#21262d; --io-line:#8b949e; }
  }
  .bg { fill: var(--bg); }
  .t1 { fill: var(--fg); font-size: 23px; font-weight: 600; }
  .t2 { fill: var(--muted); font-size: 13.5px; }
  .group { fill: var(--panel); stroke: var(--panel-line); stroke-width: 1.5; stroke-dasharray: 7 5; }
  .panel { fill: var(--panel); stroke: var(--panel-line); stroke-width: 1.5; }
  .m { fill: var(--fg); font-size: 13px; font-weight: 500; }
  .s { fill: var(--muted); font-size: 10.5px; }
  .lbl { fill: var(--fg); font-size: 12.5px; }
  .io-lbl { fill: var(--muted); font-size: 13.5px; font-weight: 500; }
  .nlab { fill: var(--muted); font-size: 14px; font-weight: 600; }
  .ptitle { fill: var(--fg); font-size: 16px; font-weight: 600; }
  .psub { fill: var(--muted); font-size: 11.5px; }
  .formula { fill: var(--fg); font-size: 12.5px; font-family: Consolas, Menlo, monospace; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .dims { fill: var(--muted); font-size: 13px; }
  .wire { stroke: var(--line); stroke-width: 1.8; }
  .plus { stroke: var(--fg); stroke-width: 1.6; }
  .wave { stroke: var(--fg); stroke-width: 1.5; }
  .bx { stroke-width: 1.6; }
  .emb { fill: var(--emb-fill); stroke: var(--emb-line); }
  .attn { fill: var(--attn-fill); stroke: var(--attn-line); }
  .norm { fill: var(--norm-fill); stroke: var(--norm-line); }
  .ffn { fill: var(--ffn-fill); stroke: var(--ffn-line); }
  .io { fill: var(--io-fill); stroke: var(--io-line); }
  .outbox { fill: var(--panel); stroke: var(--line); stroke-dasharray: 5 4; }
  .pos-fill { fill: var(--panel); }
  .pos-line { stroke: var(--line); stroke-width: 1.6; }
  .sw { stroke-width: 1.4; }
</style>
<rect class="bg" x="0" y="0" width="1400" height="1000"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker></defs>
<text x="48" y="52" class="t1" text-anchor="start">Transformer 结构图</text>
<text x="48" y="78" class="t2" text-anchor="start">重绘自 Attention Is All You Need（2017）Figure 1 —— 左：编码器；中：解码器；右：两个关键子模块展开</text>
<rect x="84" y="597" width="332" height="-98" rx="12" class="group"/>
<text x="62" y="548" text-anchor="middle" class="nlab" transform="rotate(-90 62 548)">N × 6</text>
<text x="250" y="805" class="io-lbl" text-anchor="middle">输入序列 Inputs</text>
